<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İki Sayı Toplama Sitem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .kart {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 88%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .sonuc {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="kart">
        <h2>Sayı Toplama</h2>
        <input type="number" id="sayi1" placeholder="Birinci sayı">
        <input type="number" id="sayi2" placeholder="İkinci sayı">
        <button onclick="topla()">Topla</button>
        <div class="sonuc" id="sonucAlani">Sonuc: -</div>
    </div>

    <script>
        function topla() {
            let s1 = Number(document.getElementById("sayi1").value);
            let s2 = Number(document.getElementById("sayi2").value);
            let toplam = s1 + s2;
            document.getElementById("sonucAlani").innerText = "Toplam: " + toplam;
        }
    </script>

</body>
</html>
